# Merging dev into main is the release act (spec §11): every target builds its installer and the
# GitHub Release for the app's version collects them, with the versions it was built from.
name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04 # the oldest glibc the AppImage supports
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel # macos-13 is retired; this is GitHub's x86_64 macOS image
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/desktop-knowledge-vault/node
          key: node-${{ matrix.target }}-${{ hashFiles('scripts/node-version.mjs') }}
      - run: bun install --frozen-lockfile
      - run: bun run versions:check
      - run: bun run build:host
      - run: bun run build:sidecar
      - name: Stage the engine for this target
        run: node scripts/stage-sidecar.mjs --target ${{ matrix.target }}
      - name: Bundle Node for this target
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }}
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/release-notes.mjs
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Knowledge Vault v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true # until the builds are signed
      - name: Smoke the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke-app.mjs

  sizes:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Add each installer's size to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          table=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name | test("\\.(AppImage|deb|dmg)$")) | "| \(.name) | \((.size / 1000000) | floor) MB |"')
          body=$(gh release view "$tag" --json body --jq .body)
          printf '%s\n\n### Installers\n| File | Size |\n|---|---|\n%s\n' "$body" "$table" > notes.md
          gh release edit "$tag" --notes-file notes.md

name: Vetra
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
concurrency:
  group: vetra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No Node/pnpm setup: install-command, build-command and package-dirs are
      # all empty below, so this job only builds the Dockerfile. This repo uses
      # bun (bun.lock) and has no pnpm-lock.yaml or packageManager field, so
      # pnpm/action-setup fails with "No pnpm version is specified".
      - uses: powerhouse-inc/vetra-deploy-action@v1
        with:
          app-id: 8b3119b9-efa5-4d27-a9b3-d794b2d71b78
          install-command: ''
          build-command: ''
          # The op-hub package is published separately; this App only ships the front-end.
          package-dirs: ''
          fusion-dockerfile: Dockerfile
          fusion-context: .
          fusion-image-name: knowledge-vault

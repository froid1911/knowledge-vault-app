name: Vetra
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
concurrency:
  group: vetra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: powerhouse-inc/vetra-deploy-action@v1
        with:
          app-id: 8b3119b9-efa5-4d27-a9b3-d794b2d71b78
          install-command: ''
          build-command: ''
          # The op-hub package is published separately; this App only ships the front-end.
          package-dirs: ''
          fusion-dockerfile: Dockerfile
          fusion-context: .
          fusion-image-name: knowledge-vault
